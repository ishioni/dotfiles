[settings]
env_cache = true
env_cache_ttl = "6h"
experimental = true
disable_hints = ["*"]
pipx.uvx = true

always_keep_download = false                   # deleted after install by default
always_keep_install = false                    # deleted on failure by default

[tools]
"1password-cli" = "2.35.0"
age = "latest"
atuin = "18.0.0"
chezmoi = "latest"
direnv = "latest"
flux2 = "latest"
gh = "latest"
go = "latest"
golangci-lint = "latest"
helm = "latest"
"helm-docs" = "latest"
"helm-ls" = "latest"
helmfile = "latest"
k9s = "latest"
krew = "latest"
kubectl = "latest"
opentofu = "latest"
rg = "latest"
sops = "latest"
starship = "latest"
tmux = "latest"
"aqua:dandavison/delta" = "latest"
"aqua:minio/mc" = "latest"
"aqua:astral-sh/uv" = "latest"

[plugins]
1password-env = "https://github.com/kujenga/mise-env-1password"
